# Overlay for exercising the workflow archive locally: `server -c ./configs/dev-archive`, on top of
# the defaults and configs/local. It reads the controller settings from
# argonaut-dev-controller-configmap, a copy of the real ConfigMap plus a persistence section pointing
# at a local Postgres database; fill that archive with `go run ./hack/archive-seed`.
argo:
  controller_configmap: argonaut-dev-controller-configmap
