# VERSION is the full Argonaut image reference, including the tag or digest.
# The ConfigMap named argonaut must provide the key config.
# Set server.http.addr to 0.0.0.0:4100 and leave kube.managed_namespace unset.
# List the namespaces Argonaut should show and watch in kube.namespaces.
# Enable SSO when exposing Argonaut through an Ingress. The backend Service is argonaut:80.
# Set data.database.source in the ConfigMap. When SSO is enabled, set
# sso.client_secret and sso.jwt_secret there as well.
# Apply rbac.yaml before this file to create the argonaut ServiceAccount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argonaut
  namespace: argo
  labels:
    app: argonaut
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argonaut
  template:
    metadata:
      labels:
        app: argonaut
    spec:
      serviceAccountName: argonaut
      imagePullSecrets:
        - name: ali-us-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        - name: migration
          image: "${VERSION}"
          imagePullPolicy: IfNotPresent
          args: ["migrate", "up", "--config=/data/conf/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /data/conf
              readOnly: true
      containers:
        - name: main
          image: "${VERSION}"
          imagePullPolicy: IfNotPresent
          args: ["server", "--config=/data/conf/config.yaml"]
          ports:
            - name: http
              containerPort: 4100
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /data/conf
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: argonaut
            items:
              - key: config
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: argonaut
  namespace: argo
  labels:
    app: argonaut
spec:
  type: ClusterIP
  selector:
    app: argonaut
  ports:
    - name: http
      port: 80
      targetPort: http
