{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argonaut.fullname" . }}
  labels: {{- include "argonaut.labels" . | nindent 4 }}
type: Opaque
stringData:
  ARGONAUT_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  ARGONAUT_SSO_CLIENT_SECRET: {{ .Values.secrets.ssoClientSecret | quote }}
  ARGONAUT_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
{{- end }}
