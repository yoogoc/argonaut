apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argonaut.fullname" . }}
  labels: {{- include "argonaut.labels" . | nindent 4 }}
---
# Cluster-scoped: ClusterWorkflowTemplates, and reading namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argonaut.fullname" . }}-cluster
  labels: {{- include "argonaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["clusterworkflowtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "argonaut.fullname" . }}-cluster
  labels: {{- include "argonaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argonaut.fullname" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "argonaut.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Namespaced: everything argonaut does inside a managed namespace. Bound per namespace below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argonaut.fullname" . }}-namespace
  labels: {{- include "argonaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates", "cronworkflows", "workflowtaskresults", "workflowartifactgctasks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
{{- $root := . }}
{{- $namespaces := .Values.managedNamespaces | default list }}
{{- if not (has .Values.argo.controllerNamespace $namespaces) }}{{- $namespaces = append $namespaces .Values.argo.controllerNamespace }}{{- end }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argonaut.fullname" $root }}
  namespace: {{ $ns }}
  labels: {{- include "argonaut.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argonaut.fullname" $root }}-namespace
subjects:
  - kind: ServiceAccount
    name: {{ include "argonaut.fullname" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
